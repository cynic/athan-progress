[package]
name = "athan-progress"
version = "0.1.0"
edition = "2021"
description = "Waybar progress bar for the window following each athan"

[dependencies]
salah = "0.7"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
unicode-bidi = "0.3"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
